<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfeaff">
<title>스카이챗</title>
<style>
:root{
  --ink:#0d2a45;
  --ink-soft:#4b6a86;
  --accent:#1f86e6;
  --accent-deep:#146ac4;
}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(165deg,#eaf8ff 0%,#c6e8ff 50%,#a3d7ff 100%);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid rgba(31,134,230,.55);outline-offset:2px}

/* 배경: 유리가 비쳐 보이도록 은은한 빛 덩어리 */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.8}
.bg i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-10vmax;background:#fff}
.bg i:nth-child(2){width:38vmax;height:38vmax;right:-10vmax;top:24%;background:#8ee3ff}
.bg i:nth-child(3){width:42vmax;height:42vmax;left:8%;bottom:-18vmax;background:#b9c8ff}

/* ===== 로그인 ===== */
.screen{height:100dvh;display:grid;place-items:center;padding:20px}
.card{
  width:min(380px,100%);padding:32px 26px 26px;border-radius:28px;
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 20px 50px rgba(31,134,230,.18),inset 0 1px 0 #fff;
  display:flex;flex-direction:column;gap:14px;text-align:center;
}
.logo{font-size:44px;line-height:1}
.card h1{font-size:26px;letter-spacing:-.02em}
.sub{color:var(--ink-soft);font-size:14px;margin-top:-6px}
.card label{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:13px;font-weight:600;color:var(--ink-soft)}
.card input{
  padding:13px 14px;border-radius:14px;border:1px solid rgba(31,134,230,.25);
  background:rgba(255,255,255,.92);font-size:16px;color:var(--ink);outline:none;
}
.card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,134,230,.18)}
.card button[type=submit]{
  padding:14px;border-radius:14px;color:#fff;font-weight:700;font-size:16px;
  background:linear-gradient(135deg,#34a6ff,#1a76d8);
  box-shadow:0 8px 20px rgba(26,118,216,.35);
}
.err{min-height:18px;color:#d23a4e;font-size:13px}

/* ===== 채팅 화면 ===== */
.app{position:relative;height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column}
@media(min-width:800px){
  .app{border-left:1px solid rgba(255,255,255,.6);border-right:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.18)}
}
.top{
  position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.8);
}
.title{font-weight:800;font-size:18px;letter-spacing:-.02em}
.actions{display:flex;gap:8px;align-items:center}
.pill{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
  background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);font-size:13px;font-weight:600;
}
.dot{width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.2)}
.icon-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);font-size:17px;
}
.panel{
  position:absolute;right:14px;top:100%;margin-top:6px;min-width:190px;max-height:50vh;overflow:auto;
  padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.96);
  box-shadow:0 14px 36px rgba(20,80,140,.22);border:1px solid #fff;
}
.panel h3{font-size:12px;color:var(--ink-soft);margin-bottom:6px}
.panel li{list-style:none;display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.panel .me-tag{font-size:11px;color:var(--accent-deep);background:#e3f1ff;border-radius:999px;padding:1px 7px}
.banner{background:#ffefc2;color:#7a5600;text-align:center;font-size:13px;padding:6px}

/* 스토리 */
.stories{
  display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding:10px 14px;min-height:92px;
  background:rgba(255,255,255,.35);border-bottom:1px solid rgba(255,255,255,.6);scrollbar-width:none;
}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 auto;width:62px;display:flex;flex-direction:column;align-items:center;gap:5px}
.story .ring{width:58px;height:58px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#43c6ff,#6d8dff,#43c6ff)}
.story .ring.seen{background:rgba(110,140,170,.4)}
.story .ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid #fff;display:block}
.story .label{font-size:11.5px;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story.add .ring{
  padding:0;display:grid;place-items:center;font-size:26px;color:var(--accent);
  background:rgba(255,255,255,.7);border:2px dashed rgba(31,134,230,.55);
}
.hint{align-self:center;font-size:13px;color:var(--ink-soft)}

/* 메시지 */
.messages{
  flex:1;overflow-y:auto;padding:14px 12px 18px;display:flex;flex-direction:column;gap:4px;
  overscroll-behavior:contain;
}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.me{justify-content:flex-end}
.msg:not(.compact){margin-top:8px}
.avatar{
  flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:15px;border:2px solid rgba(255,255,255,.85);
  box-shadow:0 3px 8px rgba(20,80,140,.2);
}
.avatar.ghost{visibility:hidden}
.col{display:flex;flex-direction:column;gap:3px;max-width:78%;min-width:0}
.me .col{align-items:flex-end}
.name{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-left:4px}
.line{display:flex;align-items:flex-end;gap:6px;min-width:0}
.time{font-size:11px;color:var(--ink-soft);white-space:nowrap;padding-bottom:2px}

/* 유리 말풍선: 투명도는 높게 + 글자색 대비 확보해서 읽기 편하게 */
.bubble{
  padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.5;min-width:0;
  word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;
  backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);
}
.other .bubble{
  background:rgba(255,255,255,.8);color:var(--ink);
  border:1px solid rgba(255,255,255,.95);border-top-left-radius:6px;
  box-shadow:0 6px 18px rgba(31,134,230,.12),inset 0 1px 0 rgba(255,255,255,.9);
}
.me .bubble{
  background:linear-gradient(135deg,rgba(52,166,255,.9),rgba(22,102,205,.92));color:#fff;
  text-shadow:0 1px 1px rgba(0,40,100,.25);
  border:1px solid rgba(255,255,255,.5);border-top-right-radius:6px;
  box-shadow:0 8px 20px rgba(22,102,205,.28),inset 0 1px 0 rgba(255,255,255,.45);
}
.other.compact .bubble{border-top-left-radius:18px}
.me.compact .bubble{border-top-right-radius:18px}
.bubble.has-img{padding:4px}
.bubble img{display:block;max-width:min(66vw,300px);max-height:360px;border-radius:14px;cursor:zoom-in}
.bubble.has-img .text{padding:7px 9px 5px}
.sys{
  align-self:center;margin:10px 0 6px;padding:4px 12px;border-radius:999px;
  background:rgba(255,255,255,.55);color:var(--ink-soft);font-size:12.5px;
}
.to-bottom{
  position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:6;
  padding:8px 16px;border-radius:999px;color:#fff;font-size:13px;font-weight:600;
  background:rgba(20,106,196,.92);box-shadow:0 8px 20px rgba(20,106,196,.35);
}

/* 입력창 */
.composer{
  display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.85);
}
.composer textarea{
  flex:1;min-width:0;resize:none;max-height:120px;padding:10px 14px;border-radius:20px;
  border:1px solid rgba(31,134,230,.22);background:rgba(255,255,255,.92);
  font-size:16px;line-height:1.4;outline:none;color:var(--ink);
}
.composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,134,230,.15)}
.composer .icon-btn{width:42px;height:42px;flex:0 0 auto;color:var(--accent-deep)}
.send{
  width:42px;height:42px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#34a6ff,#1a76d8);box-shadow:0 6px 14px rgba(26,118,216,.35);
}
.icon-btn svg,.send svg{width:20px;height:20px}

/* 오버레이 (사진 크게 보기 / 스토리) */
.overlay{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:rgba(8,30,55,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
#lightbox img{max-width:94vw;max-height:90dvh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet{width:min(360px,92vw);padding:18px;border-radius:24px;background:rgba(255,255,255,.96);display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:17px}
.sheet img{width:100%;max-height:50dvh;object-fit:contain;border-radius:14px;background:#e8f4ff}
.sheet input{padding:12px 14px;border-radius:12px;border:1px solid rgba(31,134,230,.3);font-size:16px;outline:none;background:#fff}
.row{display:flex;gap:8px}
.row button{flex:1;padding:12px;border-radius:12px;font-weight:700}
.ghost{background:#e5f1fb}
.primary{background:linear-gradient(135deg,#34a6ff,#1a76d8);color:#fff}

.story-view{background:#071a2e;display:block}
.story-view::before{content:"";position:absolute;inset:0 0 auto 0;height:120px;background:linear-gradient(rgba(0,20,40,.55),transparent);z-index:2}
#svImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.story-view .bar{position:absolute;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;height:3px;border-radius:3px;background:rgba(255,255,255,.3);z-index:4;overflow:hidden}
.story-view .bar i{display:block;height:100%;width:0;background:#fff}
@keyframes prog{from{width:0}to{width:100%}}
.sv-head{
  position:absolute;top:calc(18px + env(safe-area-inset-top));left:12px;right:12px;z-index:5;
  display:flex;align-items:center;gap:10px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);
}
.sv-info{flex:1;display:flex;flex-direction:column;font-size:14px;font-weight:600}
.sv-info span{font-size:12px;font-weight:400;opacity:.9}
#svClose{color:#fff;font-size:22px;width:40px;height:40px}
#svCap{
  position:absolute;left:0;right:0;bottom:0;z-index:3;padding:56px 20px calc(24px + env(safe-area-inset-bottom));
  color:#fff;font-size:16px;line-height:1.5;text-align:center;white-space:pre-wrap;
  background:linear-gradient(transparent,rgba(0,20,40,.78));
}
.tap{position:absolute;top:80px;bottom:90px;width:50%;z-index:3}
.tap.l{left:0}.tap.r{right:0}

.toast{
  position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:99;
  padding:10px 16px;border-radius:999px;background:rgba(10,40,70,.9);color:#fff;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;
}
.toast.show{opacity:1}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- 로그인 -->
<main id="login" class="screen">
  <form id="loginForm" class="card">
    <div class="logo">☁️</div>
    <h1>스카이챗</h1>
    <p class="sub">친구들끼리 수다 떠는 우리만의 방</p>
    <label>닉네임
      <input id="nameInput" maxlength="12" autocomplete="off" placeholder="예: 구름이" required>
    </label>
    <label>비밀번호
      <input id="pwInput" type="password" autocomplete="off" placeholder="친구에게 받은 비밀번호" required>
    </label>
    <button id="loginBtn" type="submit">입장하기</button>
    <p id="loginErr" class="err" role="alert"></p>
  </form>
</main>

<!-- 채팅 -->
<div id="app" class="app" hidden>
  <header class="top">
    <div class="title">☁️ 스카이챗</div>
    <div class="actions">
      <button id="usersBtn" class="pill" aria-expanded="false" aria-controls="usersPanel">
        <span class="dot"></span><span><span id="userCount">0</span>명 접속 중</span>
      </button>
      <button id="soundBtn" class="icon-btn" title="알림음 켜기/끄기" aria-label="알림음 켜기/끄기">🔔</button>
    </div>
    <div id="usersPanel" class="panel" hidden>
      <h3>지금 접속 중</h3>
      <ul id="userList"></ul>
    </div>
  </header>
  <div id="banner" class="banner" hidden>연결이 끊겼어요. 다시 연결하는 중…</div>

  <section id="stories" class="stories" aria-label="스토리"></section>

  <div id="messages" class="messages" aria-live="polite"></div>
  <button id="toBottom" class="to-bottom" hidden>새 메시지 ↓</button>

  <footer class="composer">
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button id="imgBtn" class="icon-btn" title="사진 보내기" aria-label="사진 보내기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
    </button>
    <textarea id="textInput" rows="1" maxlength="1000" placeholder="메시지를 입력하세요" aria-label="메시지 입력"></textarea>
    <button id="sendBtn" class="send" aria-label="보내기">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-7.7a.8.8 0 000-1.4L3.4 3.6a.8.8 0 00-1.1.9L4 10.5l9 1.5-9 1.5-1.7 6a.8.8 0 001.1.9z"/></svg>
    </button>
  </footer>
</div>

<!-- 사진 크게 보기 -->
<div id="lightbox" class="overlay" hidden><img alt="사진 크게 보기"></div>

<!-- 스토리 올리기 -->
<input type="file" id="storyFile" accept="image/*" hidden>
<div id="storyEdit" class="overlay" hidden>
  <div class="sheet">
    <h3>스토리 올리기</h3>
    <img id="storyPreview" alt="스토리 미리보기">
    <input id="storyCaption" maxlength="100" placeholder="한마디 적어보세요 (선택)">
    <div class="row">
      <button id="storyCancel" class="ghost">취소</button>
      <button id="storyPost" class="primary">올리기 (24시간)</button>
    </div>
  </div>
</div>

<!-- 스토리 보기 -->
<div id="storyView" class="overlay story-view" hidden>
  <div class="bar"><i></i></div>
  <div class="sv-head">
    <div id="svAvatar" class="avatar"></div>
    <div class="sv-info"><b id="svName"></b><span id="svTime"></span></div>
    <button id="svClose" aria-label="닫기">✕</button>
  </div>
  <img id="svImg" alt="스토리">
  <p id="svCap"></p>
  <div class="tap l" id="svPrev"></div>
  <div class="tap r" id="svNext"></div>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const socket = io();
  const messagesEl = $('messages');
  const textInput = $('textInput');

  // 내 고유 ID (새로고침/재접속해도 "내 메시지"가 유지되게)
  let cid = store.get('chat_cid');
  if (!cid) {
    cid = Math.random().toString(36).slice(2) + Date.now().toString(36);
    store.set('chat_cid', cid);
  }

  let creds = null;
  let joined = false;
  let stories = [];
  let lastMsg = null;
  let soundOn = store.get('chat_sound') !== 'off';
  let audioCtx = null;
  let unread = 0;
  const baseTitle = document.title;
  const seen = new Set();
  try { JSON.parse(store.get('seen_stories') || '[]').forEach((id) => seen.add(id)); } catch {}

  /* ---------- 유틸 ---------- */
  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  const fmtTime = (ts) => new Date(ts).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
  function ago(ts) {
    const m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return '방금 전';
    if (m < 60) return `${m}분 전`;
    return `${Math.floor(m / 60)}시간 전`;
  }
  function paintAvatar(node, name) {
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
    node.style.background = `hsl(${h} 62% 46%)`;
    node.textContent = [...name][0] || '?';
    return node;
  }
  const makeAvatar = (name, ghost) => paintAvatar(el('div', 'avatar' + (ghost ? ' ghost' : '')), name);

  /* ---------- 소리 / 알림 ---------- */
  function initAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch {}
  }
  document.addEventListener('click', initAudio);
  function ping() {
    if (!soundOn || !audioCtx) return;
    const t = audioCtx.currentTime;
    [[880, 0], [1318, 0.09]].forEach(([f, d]) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t + d);
      g.gain.linearRampToValueAtTime(0.18, t + d + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.22);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + d);
      o.stop(t + d + 0.25);
    });
  }
  function updateSoundBtn() {
    $('soundBtn').textContent = soundOn ? '🔔' : '🔕';
  }
  $('soundBtn').addEventListener('click', () => {
    soundOn = !soundOn;
    store.set('chat_sound', soundOn ? 'on' : 'off');
    updateSoundBtn();
    toast(soundOn ? '알림음을 켰어요' : '알림음을 껐어요');
    if (soundOn) ping();
  });
  updateSoundBtn();

  function bumpTitle() {
    if (document.hidden) {
      unread++;
      document.title = `(${unread}) ${baseTitle}`;
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { unread = 0; document.title = baseTitle; }
  });

  /* ---------- 로그인 / 재접속 ---------- */
  $('nameInput').value = store.get('chat_name') || '';

  function showLogin(err) {
    joined = false;
    $('app').hidden = true;
    $('login').hidden = false;
    $('loginBtn').disabled = false;
    $('loginErr').textContent = err || '';
  }

  function join() {
    socket.emit('join', { ...creds, cid }, (res) => {
      $('loginBtn').disabled = false;
      if (!res || !res.ok) return showLogin((res && res.error) || '입장하지 못했어요');

      joined = true;
      store.set('chat_name', res.name);
      $('login').hidden = true;
      $('app').hidden = false;
      $('banner').hidden = true;

      messagesEl.innerHTML = '';
      lastMsg = null;
      res.history.forEach((m) => addMessage(m, true));
      stories = res.stories;
      renderStories();
      renderUsers(res.users);
      scrollToBottom();
    });
  }

  $('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    initAudio();
    creds = { name: $('nameInput').value.trim(), password: $('pwInput').value };
    $('loginBtn').disabled = true;
    $('loginErr').textContent = '';
    join();
  });

  socket.on('connect', () => { if (joined && creds) join(); });
  socket.on('disconnect', () => { if (joined) $('banner').hidden = false; });

  /* ---------- 메시지 ---------- */
  const nearBottom = () => messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 140;
  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
    $('toBottom').hidden = true;
  }
  messagesEl.addEventListener('scroll', () => { if (nearBottom()) $('toBottom').hidden = true; });
  $('toBottom').addEventListener('click', scrollToBottom);

  function addMessage(m, silent) {
    const mine = m.cid === cid;
    const stick = mine || nearBottom();
    const compact = !!lastMsg && lastMsg.cid === m.cid && m.ts - lastMsg.ts < 120000;
    lastMsg = { cid: m.cid, ts: m.ts };

    const row = el('div', `msg ${mine ? 'me' : 'other'}${compact ? ' compact' : ''}`);
    if (!mine) row.appendChild(makeAvatar(m.name, compact));

    const col = el('div', 'col');
    if (!mine && !compact) col.appendChild(el('div', 'name', m.name));

    const line = el('div', 'line');
    const bubble = el('div', 'bubble' + (m.image ? ' has-img' : ''));
    if (m.image) {
      const img = new Image();
      img.src = m.image;
      img.alt = '사진';
      img.addEventListener('click', () => openLightbox(m.image));
      img.addEventListener('load', () => { if (stick) scrollToBottom(); });
      bubble.appendChild(img);
    }
    if (m.text) bubble.appendChild(el('div', 'text', m.text));

    const time = el('span', 'time', fmtTime(m.ts));
    if (mine) line.append(time, bubble); else line.append(bubble, time);
    col.appendChild(line);
    row.appendChild(col);
    messagesEl.appendChild(row);

    if (stick) scrollToBottom();
    else if (!silent) $('toBottom').hidden = false;
    if (!silent && !mine) { ping(); bumpTitle(); }
  }

  function addSystem(text) {
    const stick = nearBottom();
    lastMsg = null;
    messagesEl.appendChild(el('div', 'sys', text));
    if (stick) scrollToBottom();
  }

  socket.on('message', (m) => { if (joined) addMessage(m, false); });
  socket.on('system', (s) => { if (joined) addSystem(s.text); });

  /* ---------- 보내기 ---------- */
  function sendText() {
    const text = textInput.value.trim();
    if (!text) return;
    socket.emit('message', { text });
    textInput.value = '';
    autosize();
    textInput.focus();
  }
  function autosize() {
    textInput.style.height = 'auto';
    textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
  }
  textInput.addEventListener('input', autosize);
  textInput.addEventListener('keydown', (e) => {
    // 한글 입력 중(조합 중) Enter는 무시해야 글자가 중복 전송되지 않아요
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      sendText();
    }
  });
  $('sendBtn').addEventListener('click', sendText);

  // 사진: 큰 사진은 자동으로 줄여서 빠르게 전송
  function prepareImage(file, max) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith('image/')) return reject();
      if (file.type === 'image/gif' && file.size < 3e6) {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
        return;
      }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * s);
        const h = Math.round(img.height * s);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(); };
      img.src = url;
    });
  }
  async function sendImageFile(file) {
    try {
      const data = await prepareImage(file, 1280);
      socket.emit('message', { image: data });
    } catch {
      toast('사진을 불러오지 못했어요. 다른 사진으로 시도해 보세요');
    }
  }
  $('imgBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (f) sendImageFile(f);
  });
  textInput.addEventListener('paste', (e) => {
    const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith('image/'));
    if (f) { e.preventDefault(); sendImageFile(f); }
  });

  /* ---------- 사진 크게 보기 ---------- */
  function openLightbox(src) {
    $('lightbox').querySelector('img').src = src;
    $('lightbox').hidden = false;
  }
  $('lightbox').addEventListener('click', () => { $('lightbox').hidden = true; });

  /* ---------- 접속자 ---------- */
  function renderUsers(list) {
    $('userCount').textContent = list.length;
    const ul = $('userList');
    ul.innerHTML = '';
    list.forEach((u) => {
      const li = el('li');
      li.appendChild(makeAvatar(u.name));
      li.lastChild.style.cssText += ';width:26px;height:26px;font-size:12px';
      li.appendChild(el('span', '', u.name));
      if (u.cid === cid) li.appendChild(el('span', 'me-tag', '나'));
      ul.appendChild(li);
    });
  }
  socket.on('users', (list) => { if (joined) renderUsers(list); });
  $('usersBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const p = $('usersPanel');
    p.hidden = !p.hidden;
    $('usersBtn').setAttribute('aria-expanded', String(!p.hidden));
  });
  document.addEventListener('click', (e) => {
    if (!$('usersPanel').hidden && !$('usersPanel').contains(e.target)) {
      $('usersPanel').hidden = true;
      $('usersBtn').setAttribute('aria-expanded', 'false');
    }
  });

  /* ---------- 스토리 ---------- */
  const DAY = 24 * 60 * 60 * 1000;
  const liveStories = () => stories.filter((s) => Date.now() - s.ts < DAY);
  function saveSeen() { store.set('seen_stories', JSON.stringify([...seen].slice(-200))); }

  function renderStories() {
    const wrap = $('stories');
    wrap.innerHTML = '';

    const add = el('button', 'story add');
    add.innerHTML = '<span class="ring">+</span>';
    add.appendChild(el('span', 'label', '내 스토리'));
    add.addEventListener('click', () => $('storyFile').click());
    wrap.appendChild(add);

    const list = liveStories().slice().reverse(); // 최신순
    if (!list.length) wrap.appendChild(el('span', 'hint', '첫 스토리를 올려보세요'));
    list.forEach((s, i) => {
      const b = el('button', 'story');
      const ring = el('span', 'ring' + (seen.has(s.id) ? ' seen' : ''));
      const img = new Image();
      img.src = s.image;
      img.alt = '';
      ring.appendChild(img);
      b.append(ring, el('span', 'label', s.cid === cid ? '나' : s.name));
      b.addEventListener('click', () => openStory(list, i));
      wrap.appendChild(b);
    });
  }
  setInterval(() => { if (joined) renderStories(); }, 5 * 60 * 1000);

  socket.on('story', (s) => {
    if (!joined) return;
    stories.push(s);
    renderStories();
    if (s.cid !== cid) { ping(); toast(`${s.name}님이 스토리를 올렸어요`); }
  });

  // 올리기
  let pendingStory = null;
  $('storyFile').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      pendingStory = await prepareImage(f, 1080);
      $('storyPreview').src = pendingStory;
      $('storyCaption').value = '';
      $('storyEdit').hidden = false;
    } catch {
      toast('사진을 불러오지 못했어요');
    }
  });
  $('storyCancel').addEventListener('click', () => { $('storyEdit').hidden = true; pendingStory = null; });
  $('storyPost').addEventListener('click', () => {
    if (!pendingStory) return;
    socket.emit('story', { image: pendingStory, caption: $('storyCaption').value });
    pendingStory = null;
    $('storyEdit').hidden = true;
    toast('스토리를 올렸어요');
  });

  // 보기
  const sv = { list: [], i: 0, timer: null };
  function openStory(list, i) {
    sv.list = list;
    sv.i = i;
    $('storyView').hidden = false;
    showStory();
  }
  function showStory() {
    const s = sv.list[sv.i];
    if (!s) return closeStory();
    $('svImg').src = s.image;
    $('svName').textContent = s.cid === cid ? '나' : s.name;
    $('svTime').textContent = ago(s.ts);
    $('svCap').textContent = s.caption || '';
    $('svCap').hidden = !s.caption;
    paintAvatar($('svAvatar'), s.name);

    seen.add(s.id);
    saveSeen();
    renderStories();

    const bar = $('storyView').querySelector('.bar i');
    bar.style.animation = 'none';
    void bar.offsetWidth;
    bar.style.animation = 'prog 5s linear forwards';
    clearTimeout(sv.timer);
    sv.timer = setTimeout(nextStory, 5000);
  }
  function nextStory() { sv.i++; if (sv.i >= sv.list.length) closeStory(); else showStory(); }
  function prevStory() { if (sv.i > 0) sv.i--; showStory(); }
  function closeStory() { clearTimeout(sv.timer); $('storyView').hidden = true; }
  $('svNext').addEventListener('click', nextStory);
  $('svPrev').addEventListener('click', prevStory);
  $('svClose').addEventListener('click', closeStory);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeStory();
      $('lightbox').hidden = true;
      $('storyEdit').hidden = true;
    }
    if (!$('storyView').hidden) {
      if (e.key === 'ArrowRight') nextStory();
      if (e.key === 'ArrowLeft') prevStory();
    }
  });
})();
</script>
</body>
</html>
