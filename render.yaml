services:
  - type: web
    name: jungdo-sauhoe
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_USERS
        value: "10"
      - key: GROUP_NAME
        value: 중도일보 사우회
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jungdo-sauhoe-db
          property: connectionString

databases:
  - name: jungdo-sauhoe-db
    plan: free
    databaseName: jungdo_sauhoe
    user: jungdo_sauhoe
